name: Ozon — аналитика за месяц

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Год (например 2026)"
        required: true
        default: "2026"
      month:
        description: "Месяц числом (например 7 для июля)"
        required: true
        default: "7"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r scripts/ozon-seller/requirements.txt

      - name: Выгрузить аналитику
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          ANALYTICS_YEAR: ${{ inputs.year }}
          ANALYTICS_MONTH: ${{ inputs.month }}
        run: python scripts/ozon-seller/export_analytics.py

      - name: Загрузить результат
        uses: actions/upload-artifact@v4
        with:
          name: ozon-analytics
          path: |
            scripts/ozon-seller/analytics_traffic.csv
            scripts/ozon-seller/analytics_realization.json
          retention-days: 7
